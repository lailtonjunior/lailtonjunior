  <rect x="184" y="32" width="48" height="8" fill="#63B34F" />
  <rect x="238" y="32" width="48" height="8" fill="#4A90D9" />
  <text x="326" y="42" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="17" letter-spacing="1.5" fill="#8F9099">// BUILDING REAL SYSTEMS · SOLVING REAL PROBLEMS</text>
  <text x="1168" y="42" text-anchor="end" font-family="Inter, Arial, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#FF7A3D">LAILTON JÚNIOR</text>
