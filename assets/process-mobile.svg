<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">How I build</title>
  <desc id="desc">Mobile engineering process from research to specification, build, test, review, and deploy. AI accelerates the work; engineering defines the direction.</desc>
  <style>
    .ui { font-family: Inter, Arial, system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 25px; font-weight: 750; letter-spacing: .8px; }
    .copy { font-size: 20px; }
    .icon { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="720" height="1040" rx="18" fill="#15161D" />
  <circle cx="30" cy="28" r="6" fill="#FF7A3D" />
  <circle cx="51" cy="28" r="6" fill="#C7A24C" />
  <circle cx="72" cy="28" r="6" fill="#63B34F" />
  <text x="686" y="35" text-anchor="end" class="mono" font-size="16" letter-spacing="1.5" fill="#8F9099">ENGINEERING_LOOP</text>
  <path d="M24 56H696" stroke="#393B45" />
  <path d="M92 116V816" stroke="#393B45" stroke-width="2" stroke-dasharray="7 9" />

  <g class="icon" stroke="#FF7A3D"><circle cx="92" cy="126" r="27" /><path d="M111 145l17 17" /></g>
  <text x="158" y="119" class="mono name" fill="#E8E6E1">RESEARCH</text>
  <text x="158" y="152" class="ui copy" fill="#8F9099">Understand the real problem.</text>

  <g class="icon" stroke="#C7A24C"><path d="M67 224h37l14 14v43H67z" /><path d="M104 224v15h14M78 253h29M78 265h22" /></g>
  <text x="158" y="246" class="mono name" fill="#E8E6E1">SPECIFICATION</text>
  <text x="158" y="279" class="ui copy" fill="#8F9099">Define behavior and boundaries.</text>

  <g class="icon" stroke="#63B34F"><path d="M83 355l-23 21 23 21M103 355l23 21-23 21M101 343l-18 66" /></g>
  <text x="158" y="373" class="mono name" fill="#E8E6E1">BUILD</text>
  <text x="158" y="406" class="ui copy" fill="#8F9099">Implement with clear intent.</text>

  <g class="icon" stroke="#4A90D9"><path d="M84 471v23l-27 42h70l-27-42v-23M76 471h32M71 515h42" /></g>
  <text x="158" y="500" class="mono name" fill="#E8E6E1">TEST</text>
  <text x="158" y="533" class="ui copy" fill="#8F9099">Validate behavior and quality.</text>

  <g class="icon" stroke="#C7A24C"><circle cx="92" cy="630" r="35" /><path d="M74 630l13 13 24-28" /></g>
  <text x="158" y="627" class="mono name" fill="#E8E6E1">REVIEW</text>
  <text x="158" y="660" class="ui copy" fill="#8F9099">Inspect, refine, and approve.</text>

  <g class="icon" stroke="#4A90D9"><path d="M63 797h58a20 20 0 000-40 32 32 0 00-60-5 23 23 0 002 45zM92 808v-44M78 778l14-14 14 14" /></g>
  <text x="158" y="787" class="mono name" fill="#E8E6E1">DEPLOY</text>
  <text x="158" y="820" class="ui copy" fill="#8F9099">Deliver, observe, and iterate.</text>

  <rect x="26" y="878" width="668" height="124" rx="9" fill="#111218" stroke="#2B2D35" />
  <rect x="26" y="878" width="6" height="124" rx="3" fill="#FF7A3D" />
  <text x="58" y="929" class="mono" font-size="24" font-weight="700" fill="#C7A24C">AI accelerates the work.</text>
  <text x="58" y="971" class="mono" font-size="22" fill="#E8E6E1">Engineering defines the direction.</text>
</svg>
