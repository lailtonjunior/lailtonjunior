    <text x="156" y="410" class="ui copy" fill="#B8B7BC">Manual processes become reliable,</text>
    <text x="156" y="441" class="ui copy" fill="#B8B7BC">repeatable, digital workflows.</text>
  </g>

  <g>
    <rect x="26" y="520" width="668" height="200" rx="10" fill="#111218" stroke="#393B45" />
    <rect x="26" y="520" width="6" height="200" rx="3" fill="#63B34F" />
