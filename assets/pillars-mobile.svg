    <text x="156" y="190" class="ui copy" fill="#B8B7BC">Healthcare operations, rehabilitation,</text>
    <text x="156" y="221" class="ui copy" fill="#B8B7BC">management, and public services.</text>
  </g>

  <g>
    <rect x="26" y="300" width="668" height="200" rx="10" fill="#111218" stroke="#393B45" />
