<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">What I build</title>
  <desc id="desc">Mobile layout for four areas of work: health systems, automation, AI products, and internal tools.</desc>
  <style>
    .ui { font-family: Inter, Arial, system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 25px; font-weight: 750; letter-spacing: 1px; }
    .copy { font-size: 20px; }
    .number { font-size: 18px; font-weight: 700; }
    .icon { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="720" height="980" rx="18" fill="#15161D" />
  <circle cx="30" cy="28" r="6" fill="#FF7A3D" />
  <circle cx="51" cy="28" r="6" fill="#C7A24C" />
  <circle cx="72" cy="28" r="6" fill="#63B34F" />
  <text x="686" y="35" text-anchor="end" class="mono" font-size="16" letter-spacing="1.5" fill="#8F9099">BUILD_DOMAINS</text>
  <path d="M24 56H696" stroke="#393B45" />

  <g>
